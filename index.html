<script>
let currentMode = 'short';
let currentPlatform = 'both';
let currentTone = 'analyst';

const WORKER_URL = 'https://cryptorewritev1.brobzrkv.workers.dev';   // ← GANTI dengan URL Worker kamu yang sebenarnya

function selectMode(mode) {
  currentMode = mode;
  document.getElementById('mode-short').classList.toggle('active', mode === 'short');
  document.getElementById('mode-long').classList.toggle('active', mode === 'long');
}

function selectPlatform(plat) {
  currentPlatform = plat;
  ['both','twitter','telegram'].forEach(p => {
    document.getElementById('plat-' + p).classList.toggle('active', p === plat);
  });
}

function selectTone(el, tone) {
  currentTone = tone;
  document.querySelectorAll('.settings-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function buildSystemPrompt() {
  const toneMap = {
    analyst: 'professional crypto market analyst — data-driven, precise, measured confidence',
    alpha: 'bold alpha trader — confident, direct, slightly edgy but never reckless',
    educator: 'clear crypto educator — accessible, informative, jargon explained naturally'
  };
  return `You are a ${toneMap[currentTone]} writing polished crypto content for social media.
CRITICAL RULES:
- Write ONLY in English. Sound natural like a native speaker.
- NEVER use hashtags.
- ONLY use ticker format like $BTC, $ETH.
- No emojis unless specifically requested.
- Include opinion AND risk — not just facts.
- Every post must start with a strong hook on line 1.
- End with a soft question or observation.
Respond ONLY with valid JSON. No markdown, no backticks, no preamble.`;
}

function buildUserPrompt(rawText) {
  const platforms = {
    both: ['twitter', 'telegram'],
    twitter: ['twitter'],
    telegram: ['telegram']
  };
  const plats = platforms[currentPlatform];

  if (currentMode === 'short') {
    const outputs = [];
    plats.forEach(p => {
      outputs.push(`"${p}_short": "Short post for ${p}. STRUCTURE: 1. Hook (1 bold line) 2. Key insight (1-2 lines) 3. Opinion + Risk 4. Soft close question. Max 220 chars for Twitter, 300 for Telegram."`);
    });
    return `Raw analysis: """${rawText}"""
Generate content according to the rules. Return only valid JSON:
{
  ${outputs.join(',\n  ')}
}`;
  } else {
    // Long mode
    const outputs = [];
    if (plats.includes('twitter')) {
      outputs.push(`"twitter_thread": "Array of 4-6 tweet strings for X Thread. First is hook, last has soft question."`);
      outputs.push(`"twitter_short": "Single short Twitter post under 250 chars."`);
    }
    if (plats.includes('telegram')) {
      outputs.push(`"telegram_thread": "Array of 4-6 messages for Telegram."`);
      outputs.push(`"telegram_short": "Single Telegram post, max 350 chars."`);
    }
    outputs.push(`"article": "Long-form article (min 400 words) with Title, Lead, sections for Setup, Signal, Bull case, Risk, Key levels, and Closing."`);

    return `Raw analysis: """${rawText}"""
Generate deep analysis content. Return only valid JSON:
{
  ${outputs.join(',\n  ')}
}`;
  }
}

async function generate() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) {
    showError('Please enter your raw analysis first.');
    return;
  }

  const btn = document.getElementById('generateBtn');
  const errorEl = document.getElementById('errorMsg');
  errorEl.classList.remove('visible');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating...';

  showLoadingResult();

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: "system", content: buildSystemPrompt() },
          { role: "user", content: buildUserPrompt(raw) }
        ],
        model: "qwen-plus",        // atau "qwen-max" kalau mau lebih kuat
        temperature: 0.7,
        max_tokens: 4000
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData.error?.message || 'Worker error: ' + response.status);
    }

    const data = await response.json();
    const content = data.choices?.[0]?.message?.content || '';

    if (!content) throw new Error('Empty response from AI');

    let cleanText = content.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleanText);

    renderResults(parsed);

  } catch (err) {
    console.error(err);
    showError('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Generate Content';
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.innerHTML = msg;
  el.classList.add('visible');
}

function escHtml(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g, '<br>');
}
</script>
